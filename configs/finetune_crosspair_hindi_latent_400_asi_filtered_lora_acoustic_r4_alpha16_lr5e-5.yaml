# DIRECT-ROUTE stabilization arm 2 -- PERSONA MODE ASI (Hindi M). Tests
# whether ALIGNMENT NOISE drives the naturalness collapse: same winning recipe,
# same data source, but the ~32% of pairs flagged by audit_alignment_qc.py
# (global-stretch outliers, heavy anchor repairs, local stretch at bounds,
# worst-decile DTW mel distance) are dropped. ~136 clean train pairs remain.
# Arm 1 (recon 0.4) was a clean negative -- the collapse tracks the warped
# supervision itself, not exposure share -- so this is the main remaining
# direct-route hypothesis. Read against the unfiltered twin's curve
# (3.36 -> 3.05 -> 2.62 at 100/200/300): flattening = alignment noise
# confirmed, the full-size filtered rebuild becomes the headline arm;
# identical curve = even clean DTW supervision poisons, distill is permanent.
#
# ONE knob vs finetune_crosspair_hindi_latent_400_asi_lora_acoustic_r4_
# alpha16_lr5e-5.yaml: the filtered manifests. Build them on the container:
#   cut -d' ' -f1 exclude_bad_alignments.txt | grep -v '^#' > exclude_ids.txt
#   mkdir -p data/crosspair_hindi_latent_400_asi_filtered/manifests
#   for s in train val; do grep -v -F -f exclude_ids.txt \
#     data/crosspair_hindi_latent_400_asi/manifests/$s.jsonl \
#     > data/crosspair_hindi_latent_400_asi_filtered/manifests/$s.jsonl; done
#   cp data/crosspair_hindi_latent_400_asi/align_meta.json \
#     data/crosspair_hindi_latent_400_asi_filtered/
# (align_meta.json is REQUIRED: validate_crosspairs.py reads warp_method from
# it to apply latent-mode rules; without it the duration check fails.)

base_config: configs/xvc.yaml
reference_duration: 3.0

datasets:
  train:
    - data/crosspair_hindi_latent_400_asi_filtered/manifests/train.jsonl
  val:
    - data/crosspair_hindi_latent_400_asi_filtered/manifests/val.jsonl

dataloader:
  reconstruction_ratio: 0.2     # 80% native->ASI accent pressure, 20% clean anchor
  reversed_ratio: 0.0
  mask_target_condition: true
  latent_alignment: true        # training-only DTW map; waveforms stay pristine
  static:
    batch_size: 4

current_step: 0
current_epoch: 0
log_interval: 10
val_interval: 50
save_interval: 50               # dense checkpoints across the acquisition window
keep_interval: 50
total_step: 600

generator_warmup_steps: 100000  # adversarial path effectively off for this short run
ema_update: false
run_validation: true
freeze_eval_backbone: true

model:
  generator:
    trainable_modules: [acoustic_converter]   # LoRA-host module (base frozen)
    lora:
      enabled: true
      r: 4
      alpha: 16                 # scaling = alpha/r = 4
      dropout: 0.0
      target_modules: [acoustic_converter]
      include: ["attn.", "ff_x.ff", "ff_c.ff"]
    optim_conf:
      lr: 0.00005
