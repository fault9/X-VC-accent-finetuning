# Controlled source-warp pilot: native input is DTW/Rubber-Band aligned to the
# accented timeline while the accented supervision target remains pristine.
# Twenty train and twenty held-out validation pairs are intentionally used only
# as a go/no-go test before generating the full 647-pair candidate set.

base_config: configs/xvc.yaml
reference_duration: 3.0

datasets:
  train:
    - data/crosspair_hindi_sourcewarp_ab/manifests/train.jsonl
  val:
    - data/crosspair_hindi_sourcewarp_ab/manifests/val.jsonl

dataloader:
  reconstruction_ratio: 0.0
  reversed_ratio: 0.0
  mask_target_condition: true
  static:
    batch_size: 8

current_step: 0
current_epoch: 0
log_interval: 10
val_interval: 50
save_interval: 250
keep_interval: 250
total_step: 250

# Keep the discriminator disabled in this small causal test. Its job is to
# determine whether pristine supervision removes the learned metallic quality.
generator_warmup_steps: 100000
ema_update: false
run_validation: true
freeze_eval_backbone: true

model:
  generator:
    trainable_modules: [acoustic_converter, prenet]
    optim_conf:
      lr: 0.00003
