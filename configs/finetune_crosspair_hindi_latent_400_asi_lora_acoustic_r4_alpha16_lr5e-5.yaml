# PERSONA-MODE low-rank sweep (supervisor feedback, 2026-07-10) -- rank 4 of
# the r1/r2/r4 arm set (alpha fixed at 16, batch 4, lr 1e-4). One LoRA per
# accent x gender persona: this trains the ASI (Hindi male) adapter on the
# ASI-filtered latent_400 pairs (~200 train / 20 val). Deployment sources are
# unknown, so the L1-ARCTIC sources are generic CONTENT CARRIERS -- the
# adapter must generalize across sources and behave as target/accent-
# conditioned adaptation, not source specialization. With this little paired
# data, r8/r16 have capacity to overfit source-/pair-specific detail (a
# plausible driver of the metallicness); a heavily rank-limited delta can only
# keep the broadest accent transform. See CHANGES.md "Target-conditioned
# low-rank LoRA sweep".
#
# Deltas vs finetune_crosspair_hindi_latent_400_lora_acoustic_r8.yaml: r 8 -> 4,
# batch 8 -> 4, and ASI-only persona data (the r8 pilot trained on the shared
# two-persona set). NOTE alpha fixed at 16 means scaling alpha/r = 4 (r8 was
# 2.0): per-direction updates are amplified as rank drops. If this rank trains
# unstably, lower lr (5e-5) before touching alpha.

base_config: configs/xvc.yaml
reference_duration: 3.0

datasets:
  train:
    - data/crosspair_hindi_latent_400_asi/manifests/train.jsonl
  val:
    - data/crosspair_hindi_latent_400_asi/manifests/val.jsonl

dataloader:
  reconstruction_ratio: 0.2     # 80% native->ASI accent pressure, 20% clean anchor
  reversed_ratio: 0.0
  mask_target_condition: true
  latent_alignment: true        # training-only DTW map; waveforms stay pristine
  static:
    batch_size: 4               # small-batch regularization arm (r8 history used 8)

current_step: 0
current_epoch: 0
log_interval: 10
val_interval: 100
save_interval: 100
keep_interval: 100
total_step: 1000

generator_warmup_steps: 100000  # adversarial path effectively off for this short run
ema_update: false
run_validation: true
freeze_eval_backbone: true

model:
  generator:
    trainable_modules: [acoustic_converter]   # LoRA-host module (base frozen)
    lora:
      enabled: true
      r: 4
      alpha: 16                 # scaling = alpha/r = 4
      dropout: 0.0
      target_modules: [acoustic_converter]    # defaults to trainable_modules if omitted
      # Same proven converter set as r8/r16 (attention + both FFNs). "attn."
      # already covers the reference-stream projections (to_q_c/to_k_c/to_v_c/
      # to_out_c) and "ff_c.ff" the reference FFN, so the target-conditioning
      # path IS adapted; the x-stream stays included because segmental
      # pronunciation capacity lives there (the PATH C AdaLN arm showed
      # conditioning-side modulation alone cannot substitute phones). A
      # conditioning-side-ONLY subset is documented in CHANGES.md as the
      # follow-up escalation.
      include: ["attn.", "ff_x.ff", "ff_c.ff"]
    optim_conf:
      # 1e-4 default for the rank sweep; LR variants (0.00005 / 0.0002) are
      # generated for the WINNING rank only -- sed one-liners in CHANGES.md.
      lr: 0.00005
