# Dataset group: ASI-persona subset of the latent-aligned Hindi cross-pairs
# (~200 train / 20 val; native L1-ARCTIC sources as content carriers, ASI
# targets). Training-only DTW map; waveforms stay pristine.
#
# Build + validate:
#   scripts/build_crosspairs.py -> align_crosspairs.py -> filter_crosspairs.py
#   python scripts/validate_dataset.py data/crosspair_hindi_latent_400_asi
reference_duration: 3.0
datasets:
  train:
    - data/crosspair_hindi_latent_400_asi/manifests/train.jsonl
  val:
    - data/crosspair_hindi_latent_400_asi/manifests/val.jsonl
dataloader:
  reconstruction_ratio: 0.2     # 80% native->ASI accent pressure, 20% clean anchor
  reversed_ratio: 0.0
  mask_target_condition: true
  latent_alignment: true        # training-only DTW map; waveforms stay pristine
