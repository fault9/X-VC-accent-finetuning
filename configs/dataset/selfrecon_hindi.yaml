# Dataset group: L2-ARCTIC Hindi self-reconstruction (the "Option A" data
# presentation — every example source == target; built by
# scripts/prepare_finetuning_data.py).
datasets:
  train:
    - data/finetuning_audio/manifests/hindi/train.jsonl
  val:
    - data/finetuning_audio/manifests/hindi/val.jsonl
dataloader:
  reconstruction_ratio: 1.0   # every example: source == target (self-reconstruction)
  reversed_ratio: 0.0         # never swap source/target
  mask_target_condition: true # keep the target-condition masking
