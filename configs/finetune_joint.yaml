# Accent fine-tuning config: JOINT — one checkpoint over all groups
# (arabic + spanish + chinese + hindi + native, 10 speakers, ~100 min train).
#
# The joint design removes the per-checkpoint confound (accent condition vs
# checkpoint idiosyncrasy) and solves the native reference in the same stroke:
# ONE set of weights, the target-reference clip selects the voice/accent at
# inference. See CHANGES.md for the joint-vs-per-accent decision record.
#
#   bash scripts/finetune.sh --accent joint

base_config: configs/xvc.yaml

#===========================|  Dataset (all groups) |===========================#
datasets:
  train:
    - data/finetuning_audio/manifests/joint/train.jsonl
  val:
    - data/finetuning_audio/manifests/joint/val.jsonl

#===========================|  Self-reconstruction training |===================#
dataloader:
  reconstruction_ratio: 1.0   # every example: source == target (self-reconstruction)
  reversed_ratio: 0.0         # never swap source/target
  mask_target_condition: true # keep the target-condition masking
  static:
    batch_size: 8

#===========================|  Fine-tune schedule (scaled for 5x data) |========#
current_step: 0
current_epoch: 0

log_interval: 10
val_interval: 200
save_interval: 500
keep_interval: 500
# 5x the per-accent data (~1478 utts): 6000 steps ~= 32 epochs, matching the
# per-accent recipe's adaptation budget without matching its overfitting risk.
total_step: 6000

# Adversarial path off for the whole fine-tune (warmup beyond total_step).
generator_warmup_steps: 100000

# EMA off: the saved checkpoint is exactly the trained weights.
ema_update: false

run_validation: true
freeze_eval_backbone: true

#===========================|  Freeze all but converter + prenet |==============#
model:
  generator:
    trainable_modules: [acoustic_converter, prenet]
    optim_conf:
      lr: 0.00001            # 1e-5, 10x below pretraining
