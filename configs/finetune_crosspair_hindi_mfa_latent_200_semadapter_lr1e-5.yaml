# 200-pair MFA-guided latent-alignment pilot.
#
# This is the first non-toy MFA test.  It uses the same training recipe as the
# current best DTW-latent run (recon20 + semantic_adapter + lr1e-5), but swaps
# the latent source->target map to MFA word/phone-guided alignment.
#
# Expected dataset:
#   data/crosspair_hindi_mfa_latent_200

base_config: configs/xvc.yaml
reference_duration: 3.0

datasets:
  train:
    - data/crosspair_hindi_mfa_latent_200/manifests/train.jsonl
  val:
    - data/crosspair_hindi_mfa_latent_200/manifests/val.jsonl

dataloader:
  reconstruction_ratio: 0.2
  reversed_ratio: 0.0
  mask_target_condition: true
  latent_alignment: true
  static:
    batch_size: 8

current_step: 0
current_epoch: 0
log_interval: 10
val_interval: 100
save_interval: 100
keep_interval: 100
total_step: 1000

generator_warmup_steps: 100000
ema_update: false
run_validation: true
freeze_eval_backbone: true

model:
  generator:
    trainable_modules: [acoustic_converter, prenet, semantic_adapter]
    optim_conf:
      lr: 0.00001
