# Training group: distillation-arm runs (batch 8 to match the known
# distill-r8 comparison rows, 2000 steps, dense checkpoints).
dataloader:
  static:
    batch_size: 8
current_step: 0
current_epoch: 0
log_interval: 10
val_interval: 100
save_interval: 100
keep_interval: 100
total_step: 2000
generator_warmup_steps: 100000
ema_update: false
run_validation: true
freeze_eval_backbone: true
model:
  generator:
    optim_conf:
      lr: 0.0001
