# Training group: short LoRA fine-tune runs (the low-rank sweep recipe).
# Small batch as regularization, dense checkpoints across the 1000-step
# acquisition window, adversarial path effectively off, no EMA.
dataloader:
  static:
    batch_size: 4
current_step: 0
current_epoch: 0
log_interval: 10
val_interval: 100
save_interval: 100
keep_interval: 100
total_step: 1000
generator_warmup_steps: 100000  # adversarial path effectively off for this short run
ema_update: false
run_validation: true
freeze_eval_backbone: true
model:
  generator:
    optim_conf:
      lr: 0.0001
