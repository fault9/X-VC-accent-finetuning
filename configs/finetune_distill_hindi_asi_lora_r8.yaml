# PATH A distillation student -- PERSONA MODE (one speaker per accent x gender).
# ASI (Hindi M) LoRA student trained on same-timeline teacher pairs from
# scripts/make_distill_dataset.py: input = native clip, target = frozen
# AccentBridge teacher's rendering of THE SAME clip. Plain dataloader path
# (no latent_alignment, no DTW) -- input and target agree by construction.
#
# LoRA target set now INCLUDES the AdaLN modulation linears (attn_norm_x.,
# norm_out.) previously excluded: per-persona training makes the conditioning
# pathway a legitimate carrier for the persona realization shift, and the old
# exclusion left the delta condition-independent.
#
# Runtime after merge: stock X-VC + merged LoRA. Zero extra modules, zero
# added latency. Eval MUST use the reserved held-out sources (b0002-b0012).

base_config: configs/xvc.yaml
reference_duration: 3.0

datasets:
  train:
    - data/distill_hindi_asi/manifests/train.jsonl
  val:
    - data/distill_hindi_asi/manifests/val.jsonl

dataloader:
  reconstruction_ratio: 0.1     # small identity anchor (teacher-target recon)
  reversed_ratio: 0.0
  mask_target_condition: true
  latent_alignment: false       # plain path: same-timeline pairs, no DTW
  static:
    batch_size: 8

current_step: 0
current_epoch: 0
log_interval: 10
val_interval: 100
save_interval: 100
keep_interval: 100
total_step: 2000

generator_warmup_steps: 100000
ema_update: false
run_validation: true
freeze_eval_backbone: true

model:
  generator:
    trainable_modules: [acoustic_converter, prenet]
    lora:
      enabled: true
      r: 8
      alpha: 16
      dropout: 0.0
      target_modules: [acoustic_converter, prenet]
      # converter attention + FFN + AdaLN modulation, prenet pwconv:
      include: ["attn.", "ff_x.ff", "ff_c.ff", "attn_norm_x.", "norm_out.", "pwconv"]
    optim_conf:
      lr: 0.0001
