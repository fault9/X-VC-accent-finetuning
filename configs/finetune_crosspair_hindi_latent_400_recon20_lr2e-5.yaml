# Regularized latent-alignment pilot.
#
# Same 400-pair Hindi latent dataset as finetune_crosspair_hindi_latent_400,
# but with a clean reconstruction anchor:
#   * 80% native -> Hindi latent-aligned cross-pairs
#   * 20% target -> target reconstruction samples using identity latent alignment
#
# The anchor is intended to reduce MOS/naturalness collapse while retaining
# accent pressure.  LR is lower than the first latent_400 run for the same reason.

base_config: configs/xvc.yaml
reference_duration: 3.0

datasets:
  train:
    - data/crosspair_hindi_latent_400/manifests/train.jsonl
  val:
    - data/crosspair_hindi_latent_400/manifests/val.jsonl

dataloader:
  reconstruction_ratio: 0.2
  reversed_ratio: 0.0
  mask_target_condition: true
  latent_alignment: true
  static:
    batch_size: 8

current_step: 0
current_epoch: 0
log_interval: 10
val_interval: 100
save_interval: 100
keep_interval: 100
total_step: 1000

generator_warmup_steps: 100000
ema_update: false
run_validation: true
freeze_eval_backbone: true

model:
  generator:
    trainable_modules: [acoustic_converter, prenet]
    optim_conf:
      lr: 0.00002
