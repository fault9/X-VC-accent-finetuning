# +prenet ablation at the winning rank/LR: LoRA on acoustic_converter AND
# prenet (pwconv), r4 @ lr 5e-5, dense 50-step checkpoints over 600 steps.
# Legacy: configs/finetune_crosspair_hindi_latent_400_asi_lora_acoustic_prenet_r4_alpha16_lr5e-5.yaml
defaults:
  - model/xvc_16k
  - adapter/lora_acoustic_prenet
  - dataset/crosspair_hindi_latent_400_asi
  - training/lora_sweep_short
  - _self_

val_interval: 50
save_interval: 50               # dense checkpoints across the acquisition window
keep_interval: 50
total_step: 600

model:
  generator:
    lora:
      r: 4
    optim_conf:
      lr: 0.00005
