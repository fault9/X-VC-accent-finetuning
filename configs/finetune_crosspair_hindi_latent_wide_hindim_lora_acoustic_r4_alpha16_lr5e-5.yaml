# DIRECT-ROUTE stabilization arm 4 -- WIDE Hindi-male persona data. The >=20
# minute set: all upstream pairs re-aligned at a 2.0 s floor (references held
# >= 3.0 s), the ASI group WIDENED with RRBI (the second L2-ARCTIC Hindi male,
# per the documented group-widening option: accent generalizes across two
# voices instead of memorizing one), then audit_alignment_qc.py drops the 42%
# with suspect alignments. Result: 533 clean train pairs / 31 val =
# 29.8 min Hindi-male target audio (vs ~11 min in every prior latent arm).
# SERVING IS UNCHANGED: the reference clip selects the voice, and the persona
# reference stays ASI -- RRBI appears only as training targets conditioned on
# RRBI references.
#
# vs finetune_crosspair_hindi_latent_400_asi_lora_acoustic_r4_alpha16_lr5e-5:
# the dataset (3x audio, 2 target voices, alignment-filtered, 2.0 s floor).
# Deliberately a COMBINED data-side arm, not a factorial ablation -- the
# matched-size quality-only question is answered by the _filtered and
# _full_asi arms. Guarded run needs --validate_min_duration 2.0.
# Dataset ships as crosspair_hindi_latent_wide.tgz.

base_config: configs/xvc.yaml
reference_duration: 3.0

datasets:
  train:
    - data/crosspair_hindi_latent_wide_hindim/manifests/train.jsonl
  val:
    - data/crosspair_hindi_latent_wide_hindim/manifests/val.jsonl

dataloader:
  reconstruction_ratio: 0.2     # 80% native->Hindi-male accent pressure
  reversed_ratio: 0.0
  mask_target_condition: true
  latent_alignment: true        # training-only DTW map; waveforms stay pristine
  static:
    batch_size: 4

current_step: 0
current_epoch: 0
log_interval: 10
val_interval: 50
save_interval: 50               # dense checkpoints across the acquisition window
keep_interval: 50
total_step: 600

generator_warmup_steps: 100000  # adversarial path effectively off for this short run
ema_update: false
run_validation: true
freeze_eval_backbone: true

model:
  generator:
    trainable_modules: [acoustic_converter]   # LoRA-host module (base frozen)
    lora:
      enabled: true
      r: 4
      alpha: 16                 # scaling = alpha/r = 4
      dropout: 0.0
      target_modules: [acoustic_converter]
      include: ["attn.", "ff_x.ff", "ff_c.ff"]
    optim_conf:
      lr: 0.00005
