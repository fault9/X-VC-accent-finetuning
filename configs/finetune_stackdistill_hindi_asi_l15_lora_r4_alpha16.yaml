# STACK-DISTILL student on the DEEPER l15 teacher -- PERSONA MODE ASI (Hindi M).
# Depth point chosen by ear from the v2 merge-scale ladder (2026-07-14):
# x1.5 depth wanted, but the merged x1.5 tears (MOS 2.54, WER 0.082, "a lot of
# artifact"). This is the training-side route to the same depth: re-render the
# distill set with the renderer LoRA at x1.5 UNDER the bridge (the round-3
# b10_l15 cell, probe MOS 2.852), then test whether a fresh student can recover
# texture.  MOS ~2.95-3.05 and improved WER are HYPOTHESES, not expected
# outcomes: the deeper teacher can contain recognition errors that ordinary
# distillation may copy.  run_l15_rebuild.sh therefore scores every render and
# trains only after its quality/content/identity/accent gate passes.
#
# The student recipe remains the controlled twin of the l10 r4 run; the only
# intended treatment change is teacher depth.  The data path below is the
# gate-produced subset of l15 renders. r4 == r8 (measured twice on l10).

base_config: configs/xvc.yaml
reference_duration: 3.0

datasets:
  train:
    - data/stackdistill_hindi_asi_l15_filtered/manifests/train.jsonl
  val:
    - data/stackdistill_hindi_asi_l15_filtered/manifests/val.jsonl

dataloader:
  # This is teacher-render reconstruction, not a clean-human-audio anchor.
  # Keep it unchanged from l10 so the deeper-teacher comparison is controlled;
  # the separately tested real-ASI anchor did not improve the l10 plateau.
  reconstruction_ratio: 0.1
  reversed_ratio: 0.0
  mask_target_condition: true
  latent_alignment: false       # plain path: same-timeline pairs, no DTW
  static:
    batch_size: 8

current_step: 0
current_epoch: 0
log_interval: 10
val_interval: 100
save_interval: 100
keep_interval: 100
total_step: 2000

generator_warmup_steps: 100000
ema_update: false
run_validation: true
freeze_eval_backbone: true

model:
  generator:
    trainable_modules: [acoustic_converter, prenet]
    lora:
      enabled: true
      r: 4
      alpha: 16
      dropout: 0.0
      target_modules: [acoustic_converter, prenet]
      # converter attention + FFN + AdaLN modulation, prenet pwconv:
      include: ["attn.", "ff_x.ff", "ff_c.ff", "attn_norm_x.", "norm_out.", "pwconv"]
    optim_conf:
      lr: 0.0001
