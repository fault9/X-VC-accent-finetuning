# STACK-DISTILL student on the DEEPER l15 teacher -- PERSONA MODE ASI (Hindi M).
# Depth point chosen by ear from the v2 merge-scale ladder (2026-07-14):
# x1.5 depth wanted, but the merged x1.5 tears (MOS 2.54, WER 0.082, "a lot of
# artifact"). This is the training-side route to the same depth: re-render the
# distill set with the renderer LoRA at x1.5 UNDER the bridge (the round-3
# b10_l15 cell, gate MOS 2.852), then let a fresh student repair texture.
# Expected: ~3.0 MOS at l15 depth (student = teacher + ~0.15, measured thrice)
# vs 2.54 for the merge-scaled route at the same depth.
#
# ONE knob vs finetune_stackdistill_hindi_asi_l10_lora_r4_alpha16.yaml: the
# dataset (l10 -> l15 renders). r4 == r8 (measured twice on l10).

base_config: configs/xvc.yaml
reference_duration: 3.0

datasets:
  train:
    - data/stackdistill_hindi_asi_l15/manifests/train.jsonl
  val:
    - data/stackdistill_hindi_asi_l15/manifests/val.jsonl

dataloader:
  reconstruction_ratio: 0.1     # small identity anchor (teacher-target recon)
  reversed_ratio: 0.0
  mask_target_condition: true
  latent_alignment: false       # plain path: same-timeline pairs, no DTW
  static:
    batch_size: 8

current_step: 0
current_epoch: 0
log_interval: 10
val_interval: 100
save_interval: 100
keep_interval: 100
total_step: 2000

generator_warmup_steps: 100000
ema_update: false
run_validation: true
freeze_eval_backbone: true

model:
  generator:
    trainable_modules: [acoustic_converter, prenet]
    lora:
      enabled: true
      r: 4
      alpha: 16
      dropout: 0.0
      target_modules: [acoustic_converter, prenet]
      # converter attention + FFN + AdaLN modulation, prenet pwconv:
      include: ["attn.", "ff_x.ff", "ff_c.ff", "attn_norm_x.", "norm_out.", "pwconv"]
    optim_conf:
      lr: 0.0001
