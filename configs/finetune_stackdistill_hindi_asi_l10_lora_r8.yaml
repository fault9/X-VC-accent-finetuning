# STACK-DISTILL student v2 -- PERSONA MODE ASI (Hindi M). Teacher is the
# ear-validated STACK: AccentBridge l0plus delta at x1.0 (segmental accent)
# rendered THROUGH the accented latent LoRA checkpoint (r4 alpha16 lr5e-5
# @ step 100, lora-scale x1.0) instead of stock X-VC. 40-clip gate: 32/40
# shifted labels (england 29, indian 3), MOS 3.018, floor 2.49; ears: "very
# indian", clearly deeper than the v1 self-distill teacher. Teacher chosen for
# ACCENT over cleanliness -- the student stage refunds artifacts (v1: +0.1 MOS,
# WER to base), never accent. Dataset from scripts/make_distill_dataset.py
# with --ckpt <latent LoRA ckpt> --lora-scale 1.0 --delta-scale 1.0.
#
# ONE knob vs finetune_selfdistill_hindi_asi_lora_r8.yaml: the teacher data
# (v1 self-distill renders -> bridge+LoRA stack renders). Same LoRA set,
# r8 alpha16, batch 8, recon 0.1, total_step 2000. Next ratchet step after
# this trains: scale THIS student's delta for depth, re-gate by ear.

base_config: configs/xvc.yaml
reference_duration: 3.0

datasets:
  train:
    - data/stackdistill_hindi_asi_l10/manifests/train.jsonl
  val:
    - data/stackdistill_hindi_asi_l10/manifests/val.jsonl

dataloader:
  reconstruction_ratio: 0.1     # small identity anchor (teacher-target recon)
  reversed_ratio: 0.0
  mask_target_condition: true
  latent_alignment: false       # plain path: same-timeline pairs, no DTW
  static:
    batch_size: 8

current_step: 0
current_epoch: 0
log_interval: 10
val_interval: 100
save_interval: 100
keep_interval: 100
total_step: 2000

generator_warmup_steps: 100000
ema_update: false
run_validation: true
freeze_eval_backbone: true

model:
  generator:
    trainable_modules: [acoustic_converter, prenet]
    lora:
      enabled: true
      r: 8
      alpha: 16
      dropout: 0.0
      target_modules: [acoustic_converter, prenet]
      # converter attention + FFN + AdaLN modulation, prenet pwconv:
      include: ["attn.", "ff_x.ff", "ff_c.ff", "attn_norm_x.", "norm_out.", "pwconv"]
    optim_conf:
      lr: 0.0001
