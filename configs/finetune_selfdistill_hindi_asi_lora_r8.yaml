# SELF-DISTILL student -- PERSONA MODE ASI (Hindi M). Teacher is the
# early-stopped latent-objective LoRA model that acquired the accent at usable
# quality (crosspair_hindi_latent_400_asi r4 alpha16 lr5e-5 @ step 100:
# MOS 3.36, sim 0.731, accent labels england 10/20 vs base 2/20), rendered
# over native sources by scripts/make_selfdistill_dataset.py into same-timeline
# pairs. The bet: the student inherits the teacher's accent while the plain
# distill objective + identity anchor smooths part of the teacher's residual
# metallicness (it cannot fix what the targets don't contain -- gate the
# teacher renders by ear before training).
#
# ONE knob vs finetune_distill_hindi_asi_lora_r8.yaml: the teacher data
# (AccentBridge x1.2 -> self-distill). Same LoRA set (converter attention/FFN
# + AdaLN + prenet pwconv), r8 alpha16, batch 8, recon 0.1, total_step 2000 --
# so any difference in the student is attributable to teacher quality.

base_config: configs/xvc.yaml
reference_duration: 3.0

datasets:
  train:
    - data/selfdistill_hindi_asi/manifests/train.jsonl
  val:
    - data/selfdistill_hindi_asi/manifests/val.jsonl

dataloader:
  reconstruction_ratio: 0.1     # small identity anchor (teacher-target recon)
  reversed_ratio: 0.0
  mask_target_condition: true
  latent_alignment: false       # plain path: same-timeline pairs, no DTW
  static:
    batch_size: 8

current_step: 0
current_epoch: 0
log_interval: 10
val_interval: 100
save_interval: 100
keep_interval: 100
total_step: 2000

generator_warmup_steps: 100000
ema_update: false
run_validation: true
freeze_eval_backbone: true

model:
  generator:
    trainable_modules: [acoustic_converter, prenet]
    lora:
      enabled: true
      r: 8
      alpha: 16
      dropout: 0.0
      target_modules: [acoustic_converter, prenet]
      # converter attention + FFN + AdaLN modulation, prenet pwconv:
      include: ["attn.", "ff_x.ff", "ff_c.ff", "attn_norm_x.", "norm_out.", "pwconv"]
    optim_conf:
      lr: 0.0001
