# SELF-DISTILL student v2 -- PERSONA MODE ASI (Hindi M). Teacher is the DEPTH
# champion from the lora-scale probes: r4 alpha16 lr5e-5 @ step 100 with the
# LoRA delta amplified x3.0 at render time (40-clip gate: indian 12/40,
# england 24/40, MOS 2.598 -- vs the x1.0 v1 teacher's england 28/40 at 3.370;
# the bridge teacher was eliminated, us-majority at every delta-scale). The
# bet, round 2: the student keeps the deeper accent while smoothing the
# amplification damage. v1 measured the smoothing at ~+0.1 MOS, so expect a
# student near ~2.7 -- this arm trades quality for depth by construction.
#
# ONE knob vs finetune_selfdistill_hindi_asi_lora_r8.yaml: the dataset
# (x1.0 -> x3.0 teacher renders). Same LoRA set, r8 alpha16, batch 8,
# recon 0.1, total_step 2000.

base_config: configs/xvc.yaml
reference_duration: 3.0

datasets:
  train:
    - data/selfdistill_hindi_asi_x30/manifests/train.jsonl
  val:
    - data/selfdistill_hindi_asi_x30/manifests/val.jsonl

dataloader:
  reconstruction_ratio: 0.1     # small identity anchor (teacher-target recon)
  reversed_ratio: 0.0
  mask_target_condition: true
  latent_alignment: false       # plain path: same-timeline pairs, no DTW
  static:
    batch_size: 8

current_step: 0
current_epoch: 0
log_interval: 10
val_interval: 100
save_interval: 100
keep_interval: 100
total_step: 2000

generator_warmup_steps: 100000
ema_update: false
run_validation: true
freeze_eval_backbone: true

model:
  generator:
    trainable_modules: [acoustic_converter, prenet]
    lora:
      enabled: true
      r: 8
      alpha: 16
      dropout: 0.0
      target_modules: [acoustic_converter, prenet]
      # converter attention + FFN + AdaLN modulation, prenet pwconv:
      include: ["attn.", "ff_x.ff", "ff_c.ff", "attn_norm_x.", "norm_out.", "pwconv"]
    optim_conf:
      lr: 0.0001
