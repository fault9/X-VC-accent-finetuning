# ACCENT-CONVERSION pilot B2: DTW-guided OLA cross pairs, adapter frozen.
#
# B1 collapsed with and without semantic_adapter, ruling out the adapter choice
# as the sole cause; it did not prove alignment was the only cause. This run
# tests structurally validated and manually inspected aligned targets using the
# conservative converter+prenet module set. If intelligibility survives but no
# accent emerges, retry with semantic_adapter unfrozen at a lower learning rate.
#
#   python scripts/validate_crosspairs.py --data-root data/crosspair_hindi_dtw
#   bash scripts/finetune.sh --accent crosspair_hindi_dtw --num_workers 0

base_config: configs/xvc.yaml

datasets:
  train:
    - data/crosspair_hindi_dtw/manifests/train.jsonl
  val:
    - data/crosspair_hindi_dtw/manifests/val.jsonl

dataloader:
  reconstruction_ratio: 0.0
  reversed_ratio: 0.0
  mask_target_condition: true
  static:
    batch_size: 8

current_step: 0
current_epoch: 0
log_interval: 10
val_interval: 100
save_interval: 250
keep_interval: 250
total_step: 1500

generator_warmup_steps: 100000
ema_update: false
run_validation: true
freeze_eval_backbone: true

model:
  generator:
    trainable_modules: [acoustic_converter, prenet]   # SAFE set first
    optim_conf:
      lr: 0.00003
