# STACK-DISTILL student v3 "UNION" -- PERSONA MODE ASI (Hindi M). Two-teacher
# training set: the ear-validated DEEP teacher (l10: bridge x1.0 through the
# latent LoRA r4@100 -- 32/40 shifted, MOS 3.02, "very indian" but some vowel
# artifacts) UNION the CLEAN teacher (s15: bridge x1.0 through the v1
# self-distill student x1.5 -- 34/40 shifted, MOS 3.09, least artifacts).
# Same 221 sources rendered by both => ~440 pairs, two targets per source.
# The bet: the student regresses to the accent SHARED by both teachers while
# their disjoint artifact patterns average out -- l10's depth near s15's
# cleanliness (target: ~3.25-3.3 at l10-level accent; v2 single-teacher
# landed 3.14). Motivated by the live serving verdict on v2: real accent,
# texture below the quality bar.
#
# ONE knob vs finetune_stackdistill_hindi_asi_l10_lora_r4_alpha16.yaml: the
# dataset list (l10-only -> l10+s15 union). r4 (== r8, measured twice).

base_config: configs/xvc.yaml
reference_duration: 3.0

datasets:
  train:
    - data/stackdistill_hindi_asi_l10/manifests/train.jsonl
    - data/stackdistill_hindi_asi_s15/manifests/train.jsonl
  val:
    - data/stackdistill_hindi_asi_l10/manifests/val.jsonl
    - data/stackdistill_hindi_asi_s15/manifests/val.jsonl

dataloader:
  reconstruction_ratio: 0.1     # small identity anchor (teacher-target recon)
  reversed_ratio: 0.0
  mask_target_condition: true
  latent_alignment: false       # plain path: same-timeline pairs, no DTW
  static:
    batch_size: 8

current_step: 0
current_epoch: 0
log_interval: 10
val_interval: 100
save_interval: 100
keep_interval: 100
total_step: 2000

generator_warmup_steps: 100000
ema_update: false
run_validation: true
freeze_eval_backbone: true

model:
  generator:
    trainable_modules: [acoustic_converter, prenet]
    lora:
      enabled: true
      r: 4
      alpha: 16
      dropout: 0.0
      target_modules: [acoustic_converter, prenet]
      # converter attention + FFN + AdaLN modulation, prenet pwconv:
      include: ["attn.", "ff_x.ff", "ff_c.ff", "attn_norm_x.", "norm_out.", "pwconv"]
    optim_conf:
      lr: 0.0001
