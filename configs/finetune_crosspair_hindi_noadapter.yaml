# ACCENT-CONVERSION pilot B1 — ABLATION: re-freeze semantic_adapter.
#
# The first pilot (finetune_crosspair_hindi.yaml) unfroze semantic_adapter and
# COLLAPSED — WER >1.0, MOS 1.27, garbled output by step 250. This ablation
# changes ONE variable: train only acoustic_converter + prenet (the module set
# that was rock-stable on self-reconstruction), same cross-pair data, same LR.
#
# Reads:
#   * stable + accent by ear -> a real path; B2 (proper alignment) sharpens it.
#   * stable + no accent      -> converter+prenet can't do accent alone.
#   * still collapses         -> the crude alignment itself is toxic -> B2 or KILL.
#
#   bash scripts/finetune.sh --accent crosspair_hindi_noadapter --num_workers 0

base_config: configs/xvc.yaml

datasets:
  train:
    - data/crosspair_hindi/manifests/train.jsonl
  val:
    - data/crosspair_hindi/manifests/val.jsonl

dataloader:
  reconstruction_ratio: 0.0   # CRITICAL: keep pairs as pairs
  reversed_ratio: 0.0
  mask_target_condition: true
  static:
    batch_size: 8

current_step: 0
current_epoch: 0
log_interval: 10
val_interval: 100
save_interval: 250
keep_interval: 250
total_step: 1500

generator_warmup_steps: 100000
ema_update: false
run_validation: true
freeze_eval_backbone: true

model:
  generator:
    trainable_modules: [acoustic_converter, prenet]   # adapter RE-FROZEN
    optim_conf:
      lr: 0.00003
