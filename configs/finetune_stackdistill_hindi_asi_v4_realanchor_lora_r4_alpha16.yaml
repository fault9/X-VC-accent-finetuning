# STACK-DISTILL student v4 "REAL ANCHOR" -- PERSONA MODE ASI (Hindi M).
# The l10 distill pairs (accent, ear-validated deep teacher) unioned with a
# CAPPED set of real-ASI self-pairs (~70 utts from the wide set => ~25% of
# items), replacing the render-based reconstruction anchor with real audio.
#
# Why: v2/v3 plateau at MOS ~3.15 regardless of teacher mix -- the student
# only ever imitates RENDERED targets, so rendered texture is its ceiling.
# The self-pairs are the first texture signal that does not route through the
# renderer. reconstruction_ratio drops 0.1 -> 0.0 because the self-pairs ARE
# the recon anchor now (recon 0.1 on distill rows would anchor on renders,
# the thing this config removes).
#
# Two knobs vs finetune_stackdistill_hindi_asi_l10_lora_r4_alpha16.yaml:
# dataset union (+asi_selfpairs_wide70) and reconstruction_ratio 0.1 -> 0.0.
# Bar: accent held at v2 level (>= 16/20 shifted, clb_b0006 flips indian)
# with MOS > 3.25.

base_config: configs/xvc.yaml
reference_duration: 3.0

datasets:
  train:
    - data/stackdistill_hindi_asi_l10/manifests/train.jsonl
    - data/asi_selfpairs_wide70/manifests/train.jsonl
  val:
    - data/stackdistill_hindi_asi_l10/manifests/val.jsonl
    - data/asi_selfpairs_wide70/manifests/val.jsonl

dataloader:
  reconstruction_ratio: 0.0     # real self-pairs replace the render-recon anchor
  reversed_ratio: 0.0
  mask_target_condition: true
  latent_alignment: false       # plain path: same-timeline pairs, no DTW
  static:
    batch_size: 8

current_step: 0
current_epoch: 0
log_interval: 10
val_interval: 100
save_interval: 100
keep_interval: 100
total_step: 2000

generator_warmup_steps: 100000
ema_update: false
run_validation: true
freeze_eval_backbone: true

model:
  generator:
    trainable_modules: [acoustic_converter, prenet]
    lora:
      enabled: true
      r: 4
      alpha: 16
      dropout: 0.0
      target_modules: [acoustic_converter, prenet]
      # converter attention + FFN + AdaLN modulation, prenet pwconv:
      include: ["attn.", "ff_x.ff", "ff_c.ff", "attn_norm_x.", "norm_out.", "pwconv"]
    optim_conf:
      lr: 0.0001
