# CONTROL BASELINE for the distillation comparison -- the OLD objective
# (latent-aligned cross-pairs) under the SAME persona split (ASI only) and the
# SAME LoRA target set (incl. AdaLN) as the distill student. If the distill
# student wins, this run attributes the win to the objective change rather
# than to persona-mode or the AdaLN inclusion.
#
# Requires ASI-filtered manifests (see CHANGES.md / build with:
#   grep '"ASI__' .../train.jsonl > data/crosspair_hindi_latent_400_asi/manifests/train.jsonl
# and same for val; latent_alignment npy paths carry over unchanged).

base_config: configs/xvc.yaml
reference_duration: 3.0

datasets:
  train:
    - data/crosspair_hindi_latent_400_asi/manifests/train.jsonl
  val:
    - data/crosspair_hindi_latent_400_asi/manifests/val.jsonl

dataloader:
  reconstruction_ratio: 0.2
  reversed_ratio: 0.0
  mask_target_condition: true
  latent_alignment: true
  static:
    batch_size: 8

current_step: 0
current_epoch: 0
log_interval: 10
val_interval: 100
save_interval: 100
keep_interval: 100
total_step: 800          # ~200 ASI pairs: shorter horizon than the 400-pair runs

generator_warmup_steps: 100000
ema_update: false
run_validation: true
freeze_eval_backbone: true

model:
  generator:
    trainable_modules: [acoustic_converter, prenet]
    lora:
      enabled: true
      r: 8
      alpha: 16
      dropout: 0.0
      target_modules: [acoustic_converter, prenet]
      include: ["attn.", "ff_x.ff", "ff_c.ff", "attn_norm_x.", "norm_out.", "pwconv"]
    optim_conf:
      lr: 0.0001
