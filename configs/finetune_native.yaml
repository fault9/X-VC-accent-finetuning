# Accent fine-tuning config: NATIVE reference group (CMU ARCTIC bdl + slt).
#
# The native group receives the IDENTICAL treatment as the accent groups —
# otherwise native-vs-non-native is confounded with base-vs-fine-tuned model
# (see CHANGES.md). Same recipe as configs/finetune_arabic.yaml, different data.
#
#   bash scripts/finetune.sh --accent native

base_config: configs/xvc.yaml

#===========================|  Dataset (native group only) |====================#
datasets:
  train:
    - data/finetuning_audio/manifests/native/train.jsonl
  val:
    - data/finetuning_audio/manifests/native/val.jsonl

#===========================|  Self-reconstruction training |===================#
dataloader:
  reconstruction_ratio: 1.0   # every example: source == target (self-reconstruction)
  reversed_ratio: 0.0         # never swap source/target
  mask_target_condition: true # keep the target-condition masking
  static:
    batch_size: 8

#===========================|  Conservative fine-tune schedule |================#
current_step: 0
current_epoch: 0

log_interval: 10
val_interval: 100
save_interval: 250
keep_interval: 250
total_step: 3000

# Adversarial path off for the whole fine-tune (warmup beyond total_step).
generator_warmup_steps: 100000

# EMA off: the saved checkpoint is exactly the trained weights.
ema_update: false

run_validation: true
freeze_eval_backbone: true

#===========================|  Freeze all but converter + prenet |==============#
model:
  generator:
    trainable_modules: [acoustic_converter, prenet]
    optim_conf:
      lr: 0.00001            # 1e-5, 10x below pretraining
