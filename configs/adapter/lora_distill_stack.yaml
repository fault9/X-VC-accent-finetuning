# Adapter group: the distillation-arm LoRA placement.
#
# Converter attention + both FFNs + the AdaLN modulation projections
# (attn_norm_x., norm_out.) + prenet pwconv — the set used by every
# finetune_distill_* / selfdistill / stackdistill config (prenet stays IN,
# per supervisor intent; see CHANGES.md).
model:
  generator:
    trainable_modules: [acoustic_converter, prenet]
    lora:
      enabled: true
      r: 8
      alpha: 16
      dropout: 0.0
      target_modules: [acoustic_converter, prenet]
      include: ["attn.", "ff_x.ff", "ff_c.ff", "attn_norm_x.", "norm_out.", "pwconv"]
