# Adapter group: LoRA on acoustic_converter + prenet.
#
# Adds the prenet pointwise convolutions ("pwconv") to the converter
# attention/FFN set — the "+prenet" ablation arm of the LoRA pilots.
model:
  generator:
    trainable_modules: [acoustic_converter, prenet]
    lora:
      enabled: true
      r: 8
      alpha: 16
      dropout: 0.0
      target_modules: [acoustic_converter, prenet]
      include: ["attn.", "ff_x.ff", "ff_c.ff", "pwconv"]
