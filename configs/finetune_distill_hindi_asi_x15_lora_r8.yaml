# PATH A distillation student, DELTA-SCALE 1.5 arm -- same l0plus teacher as
# the x1.2 run, only the residual scale changes at teacher-render time. x1.5 is
# where the accent classifier started flipping to 'indian' in the synthesis
# sweep; the bet is the student LEARNS to render these off-manifold targets
# (whole-utterance DiT context) and keeps the accent while smoothing part of
# the artifact tax that the frozen renderer paid.
#
# Dataset from: scripts/make_distill_dataset.py --delta-scale 1.5
#   --bridge-ckpt exp/accentbridge_asi_l0plus/bridge.pt (same seed/split as x1.2)
# Everything below the datasets block is identical to
# configs/finetune_distill_hindi_asi_lora_r8.yaml -- one knob per arm.

base_config: configs/xvc.yaml
reference_duration: 3.0

datasets:
  train:
    - data/distill_hindi_asi_x15/manifests/train.jsonl
  val:
    - data/distill_hindi_asi_x15/manifests/val.jsonl

dataloader:
  reconstruction_ratio: 0.1     # small identity anchor (teacher-target recon)
  reversed_ratio: 0.0
  mask_target_condition: true
  latent_alignment: false       # plain path: same-timeline pairs, no DTW
  static:
    batch_size: 8

current_step: 0
current_epoch: 0
log_interval: 10
val_interval: 100
save_interval: 100
keep_interval: 100
total_step: 2000

generator_warmup_steps: 100000
ema_update: false
run_validation: true
freeze_eval_backbone: true

model:
  generator:
    trainable_modules: [acoustic_converter, prenet]
    lora:
      enabled: true
      r: 8
      alpha: 16
      dropout: 0.0
      target_modules: [acoustic_converter, prenet]
      # converter attention + FFN + AdaLN modulation, prenet pwconv:
      include: ["attn.", "ff_x.ff", "ff_c.ff", "attn_norm_x.", "norm_out.", "pwconv"]
    optim_conf:
      lr: 0.0001
