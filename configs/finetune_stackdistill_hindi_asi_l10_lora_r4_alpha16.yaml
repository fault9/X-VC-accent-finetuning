# LOW-RANK TWIN of finetune_stackdistill_hindi_asi_l10_lora_r8.yaml -- ONE
# knob: r 8 -> 4 (alpha fixed 16 => scaling 2 -> 4). Run AFTER the r8 baseline
# on the same data/stackdistill_hindi_asi_l10 dataset. Question it answers:
# does the accent+repair RENDERING compress to low rank the way the accent
# DIRECTION did (rank-1-expressible)? If r4 matches r8 on reserved-source
# eval, the persona adapter is smaller and the compactness story is stronger;
# if it lags on MOS with accent intact, the repair half needed the capacity.

base_config: configs/xvc.yaml
reference_duration: 3.0

datasets:
  train:
    - data/stackdistill_hindi_asi_l10/manifests/train.jsonl
  val:
    - data/stackdistill_hindi_asi_l10/manifests/val.jsonl

dataloader:
  reconstruction_ratio: 0.1     # small identity anchor (teacher-target recon)
  reversed_ratio: 0.0
  mask_target_condition: true
  latent_alignment: false       # plain path: same-timeline pairs, no DTW
  static:
    batch_size: 8

current_step: 0
current_epoch: 0
log_interval: 10
val_interval: 100
save_interval: 100
keep_interval: 100
total_step: 2000

generator_warmup_steps: 100000
ema_update: false
run_validation: true
freeze_eval_backbone: true

model:
  generator:
    trainable_modules: [acoustic_converter, prenet]
    lora:
      enabled: true
      r: 4
      alpha: 16
      dropout: 0.0
      target_modules: [acoustic_converter, prenet]
      # converter attention + FFN + AdaLN modulation, prenet pwconv:
      include: ["attn.", "ff_x.ff", "ff_c.ff", "attn_norm_x.", "norm_out.", "pwconv"]
    optim_conf:
      lr: 0.0001
