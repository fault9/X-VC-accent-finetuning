# Speaker groups for X-VC accent fine-tuning.
#
# Single source of truth for WHICH speakers make up each training group —
# consumed by scripts/prepare_finetuning_data.py (both `select` and `manifest`
# subcommands). Edit here, never in code.
#
# Design requirements this file encodes (see CHANGES.md):
#   * The roster lists EXACTLY the study's conversion-target voices (1M + 1F per
#     group) — in X-VC the target voice is supplied as a reference clip at
#     inference, so training on additional never-targeted speakers would spend
#     gradient steps on voices the study never converts into. ~10 min per
#     speaker (~20 min per group).
#   * L2-ARCTIC ships 2M+2F per L1; the remaining speakers can be re-added here
#     if the target list ever grows (then re-run select/manifest/make-targets).
#   * A `native` group (CMU ARCTIC US-English speakers) that receives the SAME
#     fine-tuning treatment as the accent groups — otherwise native-vs-non-native
#     is confounded with base-model-vs-fine-tuned-model.
#
# Genders per the L2-ARCTIC corpus documentation and CMU ARCTIC speaker notes.

seed: 1234  # selection/split RNG seed (recorded in selection_meta.json)

sources:
  l2arctic:
    root: "D:/datasets/arctic-audio/l2arctic"
    # {speaker} is substituted verbatim (case-sensitive)
    wav_glob: "{speaker}/wav/*.wav"
  cmu:
    root: "D:/datasets/arctic-audio/cmu"
    wav_glob: "cmu_us_{speaker}_arctic/wav/*.wav"

groups:
  arabic:
    speakers:
      ABA: {gender: M, source: l2arctic}
      SKA: {gender: F, source: l2arctic}
  spanish:
    speakers:
      EBVS:  {gender: M, source: l2arctic}
      MBMPS: {gender: F, source: l2arctic}
  chinese:
    speakers:
      TXHC: {gender: M, source: l2arctic}
      LXC:  {gender: F, source: l2arctic}
  hindi:
    speakers:
      ASI: {gender: M, source: l2arctic}
      TNI: {gender: F, source: l2arctic}
  native:
    speakers:
      bdl: {gender: M, source: cmu}
      slt: {gender: F, source: cmu}
